# Render blueprint for mahadev-traders.com
#
# Render serves an existing file in preference to any redirect rule for the same
# path, so a retired page's .html file MUST be deleted from the repo for its rule
# below to take effect. File deletion and rule addition belong in one commit.
#
# type: redirect issues a 301 Moved Permanently, which passes ranking signals to
# the destination. type: rewrite is deliberately not used anywhere here: it would
# serve the survivor's content at the old URL without changing it, leaving two
# live URLs with identical content and recreating the duplication this consolidation
# removes.
#
# Every destination below is a final surviving URL, so no rule chains into another.
#
# KNOWN ISSUE, verified live on 2026-09-03: none of these rules is firing. The origin
# is still serving 41 pages that were deleted from this repo months ago, each with its
# own timestamp from the deploy that last published it, and an existing file always
# wins over a redirect rule. Deleting the file from the repo is therefore not enough on
# its own. To fix: Render dashboard -> this static site -> Manual Deploy -> "Clear build
# cache & deploy", then run `bash seo/verify-redirects.sh` and expect 41 x OK 301.
# If the retired URLs return 404 rather than 301 after that purge, the files are gone
# but this blueprint is not being applied - that happens when the service was created
# by hand in the dashboard instead of from render.yaml. Attach the repo as a Blueprint,
# or enter these rules under the service's Redirects/Rewrites settings.
services:
  - type: web
    runtime: static
    name: mahadev-traders
    staticPublishPath: ./
    routes:

      # Service mirrors retired into their surviving /products/ page.
      - type: redirect
        source: /services/block-board-dealer-rajkot.html
        destination: /products/block-board-wholesale-supplier.html
